[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sx1302-meshcore-kiss"
version = "0.1.0"
description = "Standalone MeshCore-compatible KISS modem daemon for SX1302/WM1302 concentrators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes Agent" }]
keywords = ["meshcore", "kiss", "sx1302", "wm1302", "lora"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "paho-mqtt>=2.0",
  "pyserial>=3.5",
  "PyYAML>=6.0",
  "spidev>=3.5",
  "python-periphery>=2.4.1",
  "pyusb>=1.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
sx1302-meshcore-kiss = "sx1302_meshcore_kiss.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
