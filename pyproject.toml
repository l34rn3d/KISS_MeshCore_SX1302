[project]
name = "sx1302-meshcore-kiss"
version = "0.1.0"
description = "MeshCore-compatible KISS modem daemon for SX1302/WM1302 concentrators"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.0",
  "pyserial>=3.5",
  "PyYAML>=6.0",
]

[project.scripts]
sx1302-meshcore-kiss = "sx1302_meshcore_kiss.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "/home/chris/mesh2/pyMC_core/src"]
asyncio_mode = "auto"
