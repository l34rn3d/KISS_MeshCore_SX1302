node_id: "pyRpt-node"

# Select exactly one host interface. Use "pymc_tcp" for native pyMC TCP or
# "kiss" for the legacy KISS PTY/serial bridge. The daemon will not run both.
transport: "pymc_tcp"

kiss:
  mode: "pty"
  # Keep this outside /tmp so pyMC can open it even when the bridge and pyMC run as different users.
  symlink: "/run/sx1302-meshcore-kiss/sx1302-kiss"
  serial_port: "/dev/ttyUSB0"
  baud_rate: 115200
  tcp_bind: "127.0.0.1"
  tcp_port: 8001

pymc_tcp:
  # Native pyMC TCP modem protocol for pymc_core.hardware.tcp_radio.TCPLoRaRadio.
  # This is not KISS-over-TCP.
  # Used only when transport is "pymc_tcp".
  enabled: true
  bind_host: "0.0.0.0"
  port: 5055
  token: ""
  max_clients: 1

startup:
  # Available profiles are shown on the HTTP dashboard config page:
  # nebra_helium_docker, sensecap_wm1302_pinctrl, semtech_reset_lgw_sysfs,
  # gpioset_fallback, no_reset.
  profile: "sensecap_wm1302_pinctrl"
  # Select the installed hotspot model in the HTTP dashboard, or set it here.
  # Hotspot dropdown entries are loaded from one YAML file per hotspot in:
  # /etc/sx1302-meshcore-kiss/hotspots/*.yaml
  # Use _template.yaml in that directory as the starting point for new boards.
  # Examples: sensecap-fl1, rak-fl1, helium-fl1, nebra-indoor1, bobcat-rk3566.
  hotspot: "sensecap-fl1"

manual_radio:
  # Enable this to start the radio without waiting for pyMC/KISS to send RF config.
  # pyMC can still override the RF settings later with CMD_SET_CONFIG.
  enabled: false
  # Profiles: meshcore_eu_default, meshcore_eu_docs_legacy, meshcore_us_default,
  # meshcore_us_repeat, meshcore_433.
  profile: "meshcore_eu_default"
  auto_start: true

radio:
  backend: "semtech_c_hal"
  c_hal_lib: "/opt/sx1302-meshcore-kiss/build/c_hal/libmeshcore_lgw.so"
  lorawan_public: false
  # RF channel settings are normally supplied by pyMC/KISS. For standalone
  # hardware testing, enable manual_radio above or set these fields explicitly.
  preamble_len: 17
  sync_word: 5156
  implicit_header: false
  invert_iq: false
  spi_device: "/dev/spidev0.0"
  sx1261_spi_path: "/dev/spidev0.1"
  reset_enabled: true
  reset_required: false
  # Leave unset to use startup.profile defaults, or set explicitly to override.
  reset_script_path: "/opt/sx1302-meshcore-kiss/tools/reset_wm1302_pinctrl.sh"
  reset_script_args: []
  reset_script_env: {}
  gpio_chip: "gpiochip0"
  power_enable_pin: 18
  sx1302_reset_pin: 17
  sx1261_reset_pin: 5
  adc_reset_pin: 13
  duty_cycle_enforcement: "raise"
  lbt_enabled: true
  lbt_rssi_threshold_dbm: null
  lbt_max_attempts: 3
  lbt_backoff_ms: 50
  lbt_cad_timeout_ms: 500

crc:
  forward_unknown_crc: true
  publish_bad_crc_payload: false
  dashboard_show_bad_crc_payload: false

mqtt:
  enabled: false
  host: "127.0.0.1"
  port: 1883
  username: ""
  password: ""
  client_id: "sx1302-meshcore-kiss-pyRpt-node"
  base_topic: "meshcore/sx1302/pyRpt-node"
  qos_events: 0
  qos_status: 1
  retain_status: true
  retain_packet_events: false

status:
  publish_interval_seconds: 30
  counters_interval_seconds: 30

dashboard:
  enabled: true
  bind_host: "0.0.0.0"
  port: 8080
  max_packet_events: 50

logging:
  level: "INFO"
  log_raw_payloads: false
  live_log_path: "/run/sx1302-meshcore-kiss/live.log"
